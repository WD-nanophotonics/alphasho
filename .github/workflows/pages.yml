name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "benchmarks/web_rule_parity.py"
      - "configs/training/evaluation_positions.jsonl"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Verify frozen NN build and recorded release authorization
        run: node scripts/check-nnue-release.mjs
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install cshogi rules oracle
        run: python -m pip install cshogi==1.0.4
        working-directory: .
      - name: Verify 10,000 rules positions against cshogi
        run: python benchmarks/web_rule_parity.py --positions 10000
        working-directory: .
      - run: npm run test:parity
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
